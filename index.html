<!doctype html>
<html>
  <head>
    <title>Mental Rotation Replication Experiment</title>
    <script src="https://unpkg.com/jspsych@8.0.0"></script>
    <script src="https://unpkg.com/@jspsych/plugin-html-keyboard-response@2.0.0"></script>
    <script src="https://unpkg.com/@jspsych/plugin-image-keyboard-response@2.0.0"></script>
    <!-- plugin to preload the stimuli-->
    <script src="https://unpkg.com/@jspsych/plugin-preload@2.0.0"></script>
    <!-- survey text plugin for collectin PID -->
    <script src="https://unpkg.com/@jspsych/plugin-survey-text@2.0.0"></script>
    <!-- fullscreen plug in -->
    <script src="https://unpkg.com/@jspsych/plugin-fullscreen@1.2.1"></script>
    <!-- survey plugin for basic compehensive suvery check -->
    <script src="https://unpkg.com/@jspsych/plugin-survey-multi-choice@1.1.3"></script>
    <!--survey plugin for demographic data-->
    <script src="https://unpkg.com/@jspsych/plugin-survey-html-form@1.0.3"></script>
    <link
      href="https://unpkg.com/jspsych@8.0.0/css/jspsych.css"
      rel="stylesheet"
      type="text/css"
    />
    <!-- This is for data storage - please be sure to keep this script in all future updates to the code!! -->
    <script src="https://unpkg.com/@jspsych-contrib/plugin-pipe"></script>
  </head>

  <body></body>
  <script>
    /* initialize jsPsych */
    var jsPsych = initJsPsych({
      show_progress_bar: true,
      auto_update_progress_bar: false,
      on_finish: function () {
        jsPsych.data.displayData();
      },
    });

    /* create timeline */
    var timeline = [];

    // randomly decide what response keys are
    // using an enum here for organization since response keys can either be one or the other
    const RESPONSE_KEYS = {
      DEFAULT: "default", // default: F is same, J is different
      REVERSED: "reversed", // reversed: F is different, J is same
    };
    var response_keys = [RESPONSE_KEYS.DEFAULT, RESPONSE_KEYS.REVERSED];
    var response_keys_assignment =
      jsPsych.randomization.sampleWithoutReplacement(response_keys, 1)[0];

    /* create stimuli and image list */
    // we decided to create both the stimuli and image list at the same time here so that we do not have to duplicate the nested for-loop
    var stimulus_list = [];
    var image_names = [];
    // we also create lists to separate the stimuli database into 8 groups based on their condition (4 angles * 2 congruency states)
    var group0 = [];
    var group0R = [];
    var group50 = [];
    var group50R = [];
    var group100 = [];
    var group100R = [];
    var group150 = [];
    var group150R = [];

    // manually selecting stimuli of interest for the practice trials: [1_0_R, 1_0, 1_50, 1_100_R, 1_150_R, 1_150]
    var practice_stimuli = [
      "1_0_R",
      "2_0",
      "1_50",
      "2_50_R",
      "1_100_R",
      "2_100",
      "2_150_R",
      "1_150",
    ];

    // iterate 48 times to iterate through all 48 groups of stimuli (by baseline object)
    for (let i = 1; i < 49; i++) {
      // iterate 4 times because there are 4 rotation angles for each base object
      for (let j = 0; j < 4; j++) {
        // for each configuration, there is a same object and a different object
        image = {
          image_name: `stimuli/${i}_${j * 50}.jpg`, // use regular expression to determine file name
          object_num: i,
          angle: j * 50,
          correct_response: "same",
          correct_response_key:
            response_keys_assignment == RESPONSE_KEYS.DEFAULT ? "f" : "j",
        };
        imageR = {
          image_name: `stimuli/${i}_${j * 50}_R.jpg`, // use regular expression to determine file name
          object_num: i,
          angle: j * 50,
          correct_response: "different",
          correct_response_key:
            response_keys_assignment == RESPONSE_KEYS.DEFAULT ? "j" : "f",
        };
        // add stimulus file names to the image_names array to preload later.
        image_names.push(image.image_name, imageR.image_name);
        // push stimulus to our full list of stimuli and its respective group.
        stimulus_list.push(image, imageR);
        // get the correct list for our current iteration
        let active_list = `group${j * 50}`;
        let active_listR = `group${j * 50}R`;
        // if statements that keep images selected for the practice trial out of the final stimulus lists.
        if (practice_stimuli.includes(`${i}_${j * 50}`)) {
        } else {
          this[active_list].push(image);
        }
        if (practice_stimuli.includes(`${i}_${j * 50}_R`)) {
        } else {
          this[active_listR].push(imageR);
        }
      }
    }

    /* Preload images */
    var preload = {
      type: jsPsychPreload,
      images: image_names,
    };
    timeline.push(preload);

    // change to fullscreen mode
    timeline.push({
      type: jsPsychFullscreen,
      fullscreen_mode: true,
    });

    /* INTRODUCTION */
    // welcome participants
    var welcome = {
      type: jsPsychHtmlKeyboardResponse,
      stimulus: "Welcome to the experiment. Press any key to begin.",
    };
    // add the welcome trial to the timeline variable
    timeline.push(welcome);

    // collect participant ID
    var participant_id_entry = {
      type: jsPsychSurveyText,
      questions: [
        {
          prompt: "Please enter your participant ID (e.g. p1):",
          name: "participant_id",
        },
      ],
      on_finish: function (data) {
        console.log(data.response);
        jsPsych.data.addProperties({
          participant: data.response.participant_id,
        });
      },
    };
    timeline.push(participant_id_entry);

    //PLEASE KEEP FOR ALL FUTURE ITERATIONS
    //create a unique filename by combining a random string and a millisecond counter (to avoid duplicates)
    var random_id = jsPsych.randomization.randomID(10);
    const date = new Date();
    random_id = "p" + random_id.toString();
    var file_id = random_id + "_" + date.getTime().toString();
    const filename = `${file_id}.csv`;
    //also store the random id for convenience
    jsPsych.data.addProperties({
      random_id: random_id,
    });
    //PLEASE KEEP FOR ALL FUTURE ITERATIONS

    var instructions = `
      <p>On each trial, you will see two 3D shapes. The shape on the left will be your <strong>baseline shape</strong>. The shape on the right will be the <strong>target shape</strong>.</p>
      <p>If the two shapes are the same, press <strong>F</strong>.</p>
      <p>If the two shapes are different, press <strong>J</strong>.</p>
      <p>Press any key to continue.</p>
    `;

    var reversed_instructions = `
      <p>On each trial, you will see two 3D shapes. The shape on the left will be your <strong>baseline shape</strong>. The shape on the right will be the <strong>target shape</strong>.</p>
      <p>If the two shapes are different, press <strong>F</strong>.</p>
      <p>If the two shapes are the same, press <strong>J</strong>.</p>
      <p>Press any key to continue.</p>
    `;

    /* INSTRUCTIONS */
    var instructions = {
      type: jsPsychHtmlKeyboardResponse,
      // ternary statement that just says if default, display instructions, and otherwise, display reversed instructions
      stimulus:
        response_keys_assignment == RESPONSE_KEYS.DEFAULT
          ? instructions
          : reversed_instructions,
    };
    // add instructions trial to the tl
    timeline.push(instructions);

    /* COMPREHENSIVE SURVEY CHECK */

    var comprehensive_survey_check = {
      type: jsPsychSurveyMultiChoice,
      preamble:
        "<strong>Please answer the following questions to confirm you understand the task:</strong>",
      questions: [
        {
          prompt: "What counts as 'same' in this experiment?",
          name: "same_definition",
          options: [
            "The two shapes are identical but may be rotated",
            "The shapes are completely different objects",
            "The shapes are different colors",
          ],
          required: true,
        },

        {
          prompt: "What counts as 'different' in this experiment?",
          name: "different_definition",
          options: [
            "The shapes are identical but rotated",
            "The two shapes are different objects",
            "The shapes are different sizes",
          ],
          required: true,
        },

        {
          prompt: "Which key do you press if the shapes are SAME?",
          name: "same_key",
          options: ["F key", "J key"],
          required: true,
        },

        {
          prompt: "Which key do you press if the shapes are DIFFERENT?",
          name: "different_key",
          options: ["F key", "J key"],
          required: true,
        },

        {
          prompt: "How should you respond during each trial?",
          name: "speed_accuracy",
          options: [
            "Focus only on speed",
            "Focus only on accuracy",
            "Respond as quickly and accurately as possible",
          ],
          required: true,
        },
      ],

      on_finish: function (data) {
        var responses = data.response;

        var correct_same =
          responses.same_definition ===
          "The two shapes are identical but may be rotated.";

        var correct_different =
          responses.different_definition ===
          "The two shapes are different objects.";

        var correct_same_key =
          response_keys_assignment == RESPONSE_KEYS.DEFAULT
            ? responses.same_key === "F key"
            : responses.same_key === "J key";

        var correct_different_key =
          response_keys_assignment == RESPONSE_KEYS.DEFAULT
            ? responses.different_key === "J key"
            : responses.different_key === "F key";

        var correct_speed =
          responses.speed_accuracy ===
          "Respond as quickly and accurately as possible.";

        data.comprehension_pass =
          correct_same &&
          correct_different &&
          correct_same_key &&
          correct_different_key &&
          correct_speed;
      },
    };

    timeline.push(comprehensive_survey_check);

    /* PRACTICE TRIALS (8) */
    var practice_start = {
      type: jsPsychHtmlKeyboardResponse,
      stimulus:
        "There will be 8 practice trials before the real experiment. Press any key to begin.",
    };
    // add the practice start trial to the timeline variable
    timeline.push(practice_start);

    var default_prompt =
      "<p>Press <strong>F</strong> if the shapes are the same, <strong>J</strong> if the shapes are different.</p>";
    var reversed_prompt =
      "<p>Press <strong>F</strong> if the shapes are different,  <strong>J</strong> if the shapes the same.</p>";
    // TODO: make feedback more obvious
    var shuffled_practice = jsPsych.randomization.repeat(practice_stimuli, 1);

    for (let i = 0; i < shuffled_practice.length; i++) {
      //cycle through all trials in the practice block
      var current_prac = shuffled_practice[i];
      let correct_key = current_prac.endsWith("_R")
        ? response_keys_assignment == RESPONSE_KEYS.DEFAULT
          ? "j"
          : "f"
        : response_keys_assignment == RESPONSE_KEYS.DEFAULT
          ? "f"
          : "j";

      // create a trial
      var prac_test = {
        type: jsPsychHtmlKeyboardResponse,
        stimulus: '<img src="stimuli/' + current_prac + '.jpg">',
        prompt:
          response_keys_assignment == RESPONSE_KEYS.DEFAULT
            ? default_prompt
            : reversed_prompt,
        choices: ["f", "j"],
        data: {
          correct_key: correct_key,
        },
        on_finish: function (data) {
          // check if response matches the trial's correct key
          data.correct = data.response === data.correct_key;
        },
      };

      var feedback = {
        type: jsPsychHtmlKeyboardResponse,
        trial_duration: 1000,
        post_trial_gap: 250, // 250 ms gap
        stimulus: function () {
          var last_trial_correct = jsPsych.data
            .get()
            .last(1)
            .values()[0].correct;
          if (last_trial_correct) {
            return '<p style="font-size: 50px; color: green;">Correct!</p>'; // the parameter value has to be returned from the function
          } else {
            return '<p style="font-size: 50px; color: red;">Incorrect</p>'; // the parameter value has to be returned from the function
          }
        },
      };

      //push the test and feedback trials
      timeline.push(prac_test, feedback);
      //end the for loop here
    }

    /* TRIALS */
    var trials_start = {
      type: jsPsychHtmlKeyboardResponse,
      stimulus:
        "We will now begin the real experiment. Press any key to begin.",
    };
    // add the trials start trial to the timeline variable
    timeline.push(trials_start);

    var total_trials = 96;
    var completed_trials = 0;
    //Randomly selecting the experimental stimuli to show to the participant.
    var stimulus_list = [];
    for (let i = 0; i < 4; i++) {
      // get the correct list for our current iteration
      let active_list = `group${i * 50}`;
      let active_listR = `group${i * 50}R`;
      // select 12 stimuli at random from each list and push it into a temporary array variable.
      let a = jsPsych.randomization.sampleWithoutReplacement(
        this[active_list],
        total_trials / 8,
      );
      let b = jsPsych.randomization.sampleWithoutReplacement(
        this[active_listR],
        total_trials / 8,
      );
      // Loop through the list of randomly selected stimuli to add each object to the list because the output of sampleWithoutReplacement is an array.
      for (let j = 0; j < total_trials / 8; j++) {
        stimulus_list.push(a[j]);
        stimulus_list.push(b[j]);
      }
    }

    // Check to make sure the same condition does not occur more than 3 times in a row. If it does, then reshuffle the stimuli and try again.
    var repeats = true;
    var counter = 0;
    while (repeats == true) {
      stimulus_list = jsPsych.randomization.shuffle(stimulus_list);
      counter++
      //By default, if no violations are raised, the while loop should only run once.
      repeats = false;
      var a;
      var b;
      var c;
      var d;
      for (let i = 0; i < stimulus_list.length; i++) {
        //Use variables to save info for the last three items.
        let target = stimulus_list[i].image_name;
        a = b;
        b = c;
        c = d;
        d = target.endsWith("_R.jpg") ? "incongruent" : "congruent";
        //If there is a 4-in-a-row match, set repeats to true so the while loop will run again and break out of the for loop to save time.
        if (a == b && b == c && c == d) {
          repeats = true;
          break;
        }
      }
      if (counter > 15000) {
        break
      }
    }

    var min_trial_gap = 250;
    var max_trial_gap = 500;

    // First experimental trial block. Uses the first half ot the experimental stimuli list.
    var blockA = {
      timeline: [
        {
          type: jsPsychImageKeyboardResponse,
          prompt:
            response_keys_assignment == RESPONSE_KEYS.DEFAULT
              ? default_prompt
              : reversed_prompt,
          choices: ["f", "j"],
          data: {
            object_num: jsPsych.timelineVariable(`object_num`),
            angle: jsPsych.timelineVariable(`angle`),
            correct_response: jsPsych.timelineVariable(`correct_response`),
            correct_response_key:
              jsPsych.timelineVariable(`correct_response_key`),
          },
          stimulus: jsPsych.timelineVariable(`image_name`),
          on_finish: function (data) {
            // https://www.jspsych.org/v8/overview/progress-bar/
            // at the end of each trial, update the progress bar
            // increment number of completed trials by 1 and divide by total # of trials
            completed_trials++;
            jsPsych.progressBar.progress = completed_trials / total_trials;
            // check if response matches the trial's correct key
            data.correct = data.response === data.correct_key;
          },
          post_trial_gap:
            Math.floor(Math.random() * (max_trial_gap - min_trial_gap + 1)) +
            min_trial_gap,
        },
      ],
      timeline_variables: stimulus_list.slice(0, total_trials / 2),
    };
    timeline.push(blockA);

    var block_gap = {
      type: jsPsychHtmlKeyboardResponse,
      stimulus:
        "You may now take a brief break before the next block. Press any key to continue.",
    };
    // add the block gap trial to the timeline variable
    timeline.push(block_gap);

    // Second trial block. Uses the second half of the stimulus list.
    var blockB = {
      timeline: [
        {
          type: jsPsychImageKeyboardResponse,
          prompt:
            response_keys_assignment == RESPONSE_KEYS.DEFAULT
              ? default_prompt
              : reversed_prompt,
          choices: ["f", "j"],
          data: {
            object_num: jsPsych.timelineVariable(`object_num`),
            angle: jsPsych.timelineVariable(`angle`),
            correct_response: jsPsych.timelineVariable(`correct_response`),
            correct_response_key:
              jsPsych.timelineVariable(`correct_response_key`),
          },
          stimulus: jsPsych.timelineVariable(`image_name`),
          on_finish: function (data) {
            // https://www.jspsych.org/v8/overview/progress-bar/
            // at the end of each trial, update the progress bar
            // increment number of completed trials by 1 and divide by total # of trials
            completed_trials++;
            jsPsych.progressBar.progress = completed_trials / total_trials;
            // check if response matches the trial's correct key
            data.correct = data.response === data.correct_key;
          },
          post_trial_gap:
            Math.floor(Math.random() * (max_trial_gap - min_trial_gap + 1)) +
            min_trial_gap,
        },
      ],
      timeline_variables: stimulus_list.slice(total_trials / 2),
    };
    timeline.push(blockB);

    // Collect demographic information about participants
    var demographic_info = {
      type: jsPsychSurveyHtmlForm,
      preamble: "<h3 sytle=>Please answer the following demographic questions:</h3>",
      html: `
      <div style="text-align: left;">
        <p>What is your age?</p>
        <input name="age" type="number" required />

        <p>What year in college/university are you?</p>
        <select name="year" required>
          <option value="">Select one</option>
          <option>1st year</option>
          <option>2nd year</option>
          <option>3rd year</option>
          <option>4th year</option>
          <option>5th year+</option>
        </select>

        <p>What is your specialization in Cognitive Science?</p>
        <select name="major" required>
          <option value="">Select one</option>
          <option>Neuroscience</option>
          <option>Clinical Aspects of Cognition</option>
          <option>Design & Interaction</option>
          <option>Machine Learning & Neural Computation</option>
          <option>Cognitive Behavioral Neuroscience</option>
          <option>Language & Culture</option>
          <option>None, B.S. in CogSci</option>
        </select>

        <p>Do you have a minor? (Optional)</p>
        <input name="minor" type="text" />

        <p>Which gender do you most identify with?</p>
        <select name="gender" required>
          <option value="">Select one</option>
          <option>Man</option>
          <option>Woman</option>
          <option>Non-binary / Non-conforming</option>
          <option>Transgender</option>
          <option>Prefer not to say</option>
        </select>
      </div>
      `
    };
    timeline.push(demographic_info);

    //PLEASE KEEP FOR ALL FUTURE ITERATIONS
    //this portion of the code ensures that the data gets sent to be stored on OSF
    const save_data = {
      type: jsPsychPipe,
      action: "save",
      experiment_id: "horOOckL0l3L",
      filename: filename,
      data_string: () => jsPsych.data.get().csv(),
    };
    timeline.push(save_data);
    //PLEASE KEEP FOR ALL FUTURE ITERATIONS

    /* DEBRIEF */
    // debrief participants -- just need to style it better for center - aranza
    var debrief = {
      type: jsPsychHtmlKeyboardResponse,
      stimulus:
        `<center>
          <p>Thank you for participating in this study!</p>
          <p>We had you complete <i>all</i> those trials in order to investigate mental rotation abilities.</p>
          <p>With your help, we can better understand how people mentally rotate 3D objects in side-by-side comparisons.</p>
          <p>Press any key to complete the experiment.</p> 
          </center>
          `
    };
    // add the debrief trial to the timeline variable
    timeline.push(debrief);

    /* thank you message */
    var thank_you = {
      type: jsPsychHtmlKeyboardResponse,
      stimulus:
        "Thank you for participating! Press any key to exit fullscreen.",
    };
    // add the thank you to the timeline variable
    timeline.push(thank_you);
    // exit fullscreen mode; code taken from: https://www.jspsych.org/v7/overview/fullscreen/
    timeline.push({
      type: jsPsychFullscreen,
      fullscreen_mode: false,
    });

    /* start the experiment */
    jsPsych.run(timeline);
  </script>
</html>
