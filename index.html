<!doctype html>
<html>
  <head>
    <title>Mental Rotation Replication Experiment</title>
    <script src="https://unpkg.com/jspsych@8.0.0"></script>
    <script src="https://unpkg.com/@jspsych/plugin-html-keyboard-response@2.0.0"></script>
    <script src="https://unpkg.com/@jspsych/plugin-image-keyboard-response@2.0.0"></script>
    <!-- plugin to preload the stimuli-->
    <script src="https://unpkg.com/@jspsych/plugin-preload@2.0.0"></script>
    <!-- survey text plugin for collectin PID -->
    <script src="https://unpkg.com/@jspsych/plugin-survey-text@2.0.0"></script>
    <!-- fullscreen plug in -->
    <script src="https://unpkg.com/@jspsych/plugin-fullscreen@1.2.1"></script>
    <!-- survey plugin for basic compehensive suvery check -->
    <!--survey plugin for multiple choice demographic data-->
    <script src="https://unpkg.com/@jspsych/plugin-survey-multi-choice@1.1.3"></script>
    <link
      href="https://unpkg.com/jspsych@8.0.0/css/jspsych.css"
      rel="stylesheet"
      type="text/css"
    />
    <!-- This is for data storage - please be sure to keep this script in all future updates to the code!! -->
    <script src="https://unpkg.com/@jspsych-contrib/plugin-pipe"></script>
  </head>

  <body></body>
  <script>
    /* initialize jsPsych */
    var jsPsych = initJsPsych({
      show_progress_bar: true,
      auto_update_progress_bar: false,
      on_finish: function () {
        jsPsych.data.displayData();
      },
    });

    /* create timeline */
    var timeline = [];

    // randomly decide what response keys are
    // using an enum here for organization since response keys can either be one or the other
    const RESPONSE_KEYS = {
      DEFAULT: "default", // default: F is same, J is different
      REVERSED: "reversed", // reversed: F is different, J is same
    };
    var response_keys = [RESPONSE_KEYS.DEFAULT, RESPONSE_KEYS.REVERSED];
    var response_keys_assignment =
      jsPsych.randomization.sampleWithoutReplacement(response_keys, 1)[0];

    /* create stimuli and image list */
    // we decided to create both the stimuli and image list at the same time here so that we do not have to duplicate the nested for-loop
    var stimulus_list = [];
    var image_names = [];
    // we also create lists to separate the stimuli database into 8 groups based on their condition (4 angles * 2 congruency states)
    var group0 = [];
    var group0R = [];
    var group50 = [];
    var group50R = [];
    var group100 = [];
    var group100R = [];
    var group150 = [];
    var group150R = [];

    // manually selecting stimuli of interest for the practice trials: [1_0_R, 1_0, 1_50, 1_100_R, 1_150_R, 1_150]
    var practice_stimuli = [
      "1_0_R",
      "1_0",
      "1_50",
      "1_100_R",
      "1_150_R",
      "1_150",
      "2_0_R",
      "2_50",
      "2_50_R",
      "2_100",
      "2_150",
      "2_150_R",
    ];

    // iterate 48 times to iterate through all 48 groups of stimuli (by baseline object)
    for (let i = 1; i < 49; i++) {
      // iterate 4 times because there are 4 rotation angles for each base object
      for (let j = 0; j < 4; j++) {
        // for each configuration, there is a same object and a different object
        image = {
          image_name: `stimuli/${i}_${j * 50}.jpg`, // use regular expression to determine file name
          object_num: i,
          angle: j * 50,
          correct_response: "same",
          correct_response_key:
            response_keys_assignment == RESPONSE_KEYS.DEFAULT ? "f" : "j",
        };
        imageR = {
          image_name: `stimuli/${i}_${j * 50}_R.jpg`, // use regular expression to determine file name
          object_num: i,
          angle: j * 50,
          correct_response: "different",
          correct_response_key:
            response_keys_assignment == RESPONSE_KEYS.DEFAULT ? "j" : "f",
        };
        // add stimulus file names to the image_names array to preload later.
        image_names.push(image.image_name, imageR.image_name);
        // push stimulus to our full list of stimuli and its respective group.
        stimulus_list.push(image, imageR);
        // get the correct list for our current iteration
        let active_list = `group${j * 50}`;
        let active_listR = `group${j * 50}R`;
        // if statements that keep images selected for the practice trial out of the final stimulus lists.
        if (practice_stimuli.includes(`${i}_${j * 50}`)) {
        } else {
          this[active_list].push(image);
        }
        if (practice_stimuli.includes(`${i}_${j * 50}_R`)) {
        } else {
          this[active_listR].push(imageR);
        }
      }
    }

    /* Preload images */
    var preload = {
      type: jsPsychPreload,
      images: image_names,
    };
    timeline.push(preload);

    // change to fullscreen mode
    timeline.push({
      type: jsPsychFullscreen,
      fullscreen_mode: true,
    });

    /* INTRODUCTION */
    // welcome participants
    var welcome = {
      type: jsPsychHtmlKeyboardResponse,
      stimulus: "Welcome to the experiment. Press any key to begin.",
    };
    // add the welcome trial to the timeline variable
    timeline.push(welcome);

    // collect participant ID
    var participant_id_entry = {
      type: jsPsychSurveyText,
      questions: [
        {
          prompt: "Please enter your participant ID (e.g. p1):",
          name: "participant_id",
        },
      ],
      on_finish: function (data) {
        console.log(data.response);
        jsPsych.data.addProperties({
          participant: data.response.participant_id,
        });
      },
    };
    timeline.push(participant_id_entry);

    //PLEASE KEEP FOR ALL FUTURE ITERATIONS
    //create a unique filename by combining a random string and a millisecond counter (to avoid duplicates)
    var random_id = jsPsych.randomization.randomID(10);
    const date = new Date();
    random_id = "p" + random_id.toString();
    var file_id = random_id + "_" + date.getTime().toString();
    const filename = `${file_id}.csv`;
    //also store the random id for convenience
    jsPsych.data.addProperties({
      random_id: random_id,
    });
    //PLEASE KEEP FOR ALL FUTURE ITERATIONS

    var instructions = `
      <p>On each trial, you will see two 3D shapes. The shape on the left will be your <strong>baseline shape</strong>. The shape on the right will be the <strong>target shape</strong>.</p>
      <p>If the two shapes are the same, press F.</p>
      <p>If the two shapes are different, press J.</p>
      <p>Press any key to continue.</p>
    `;

    var reversed_instructions = `
      <p>On each trial, you will see two 3D shapes. The shape on the left will be your <strong>baseline shape</strong>. The shape on the right will be the <strong>target shape</strong>.</p>
      <p>If the two shapes are different, press F.</p>
      <p>If the two shapes are the same, press J.</p>
      <p>Press any key to continue.</p>
    `;

    /* INSTRUCTIONS */
    var instructions = {
      type: jsPsychHtmlKeyboardResponse,
      // ternary statement that just says if default, display instructions, and otherwise, display reversed instructions
      stimulus:
        response_keys_assignment == RESPONSE_KEYS.DEFAULT
          ? instructions
          : reversed_instructions,
    };
    // add instructions trial to the tl
    timeline.push(instructions);

    /* TODO: basic comprehension survey check */

    /* PRACTICE TRIALS (12) */
    var practice_start = {
      type: jsPsychHtmlKeyboardResponse,
      stimulus:
        "There will be 12 practice trials before the real experiment. Press any key to begin.",
    };
    // add the practice start trial to the timeline variable
    timeline.push(practice_start);

    var default_prompt =
      "<p>Press F if the shapes are the same, J if the shapes are different.<\p>";
    var reversed_prompt =
      "<p>Press F if the shapes are different, J if the shapes the same.<\p>";
    // TODO: make feedback more obvious
    var shuffled_practice = jsPsych.randomization.repeat(practice_stimuli, 1);

    for (let i = 0; i < shuffled_practice.length; i++) {
      //cycle through all trials in the practice block
      var current_prac = shuffled_practice[i];
      let correct_key = current_prac.endsWith("_R") ? "j" : "f";

      // create a trial
      var prac_test = {
        type: jsPsychHtmlKeyboardResponse,
        stimulus: '<img src="stimuli/' + current_prac + '.jpg">',
        prompt:
          response_keys_assignment == RESPONSE_KEYS.DEFAULT
            ? default_prompt
            : reversed_prompt,
        choices: ["f", "j"],
        data: {
          correct_key: correct_key,
        },
        on_finish: function (data) {
          // check if response matches the trial's correct key
          data.correct = data.response === data.correct_key;
        },
      };

      var feedback = {
        type: jsPsychHtmlKeyboardResponse,
        trial_duration: 1000,
        post_trial_gap: 250, // 250 ms gap
        stimulus: function () {
          var last_trial_correct = jsPsych.data
            .get()
            .last(1)
            .values()[0].correct;
          if (last_trial_correct) {
            return "<p><font color='green'>Correct!</font></p>"; // the parameter value has to be returned from the function
          } else {
            return "<p><font color='red'>Incorrect.</font></p>"; // the parameter value has to be returned from the function
          }
        },
      };

      //push the test and feedback trials
      timeline.push(prac_test, feedback);
      //end the for loop here
    }

    /* TRIALS */

    var trials_start = {
      type: jsPsychHtmlKeyboardResponse,
      stimulus:
        "We will now begin the real experiment. Press any key to begin.",
    };
    // add the trials start trial to the timeline variable
    timeline.push(trials_start);

    // TODO: CHANGE NUMBER OF TRIALS LATER
    // TODO: ADD OTHER DATA FIELDS (E.G. ISCORRECT)
    var total_trials = 8;
    var completed_trials = 0;

    var min_trial_gap = 250;
    var max_trial_gap = 500;

    // first block: 4 trials
    for (let i = 0; i < total_trials / 2; i++) {
      // randomly decide a trial gap from 250 ms to 500 ms, inclusive
      // https://stackoverflow.com/questions/1527803/generating-random-whole-numbers-in-javascript-in-a-specific-range
      var trial_gap =
        Math.floor(Math.random() * (max_trial_gap - min_trial_gap + 1)) +
        min_trial_gap;

      // randomly select a stimulus item (without replacement to ensure no repeats) from the stimulus list
      var stimulus_item = jsPsych.randomization.sampleWithoutReplacement(
        stimulus_list,
        1,
      )[0];
      // create a mental rotation trial from the stimulus item
      var trial = {
        type: jsPsychImageKeyboardResponse,
        // ternary statement that just says if default, display default prompt, and otherwise, display reversed prompt
        prompt:
          response_keys_assignment == RESPONSE_KEYS.DEFAULT
            ? default_prompt
            : reversed_prompt,
        choices: ["f", "j"],
        data: {
          correct_response: stimulus_item["correct_response"],
          correct_response_key: stimulus_item["correct_response_key"],
        },
        stimulus: stimulus_item["image_name"],
        on_finish: function (data) {
          // https://www.jspsych.org/v8/overview/progress-bar/
          // at the end of each trial, update the progress bar
          // increment number of completed trials by 1 and divide by total # of trials
          completed_trials++;
          jsPsych.progressBar.progress = completed_trials / total_trials;

          // check if response matches the trial's correct key
          data.correct = data.response === data.correct_key;
        },
        post_trial_gap: trial_gap,
      };
      timeline.push(trial);
    }

    var block_gap = {
      type: jsPsychHtmlKeyboardResponse,
      stimulus:
        "You may now take a brief break before the next block. Press any key to continue.",
    };
    // add the block gap trial to the timeline variable
    timeline.push(block_gap);

    // second block: 4 trials
    for (let i = 0; i < total_trials / 2; i++) {
      // randomly decide a trial gap from 250 ms to 500 ms, inclusive
      // https://stackoverflow.com/questions/1527803/generating-random-whole-numbers-in-javascript-in-a-specific-range
      var trial_gap =
        Math.floor(Math.random() * (max_trial_gap - min_trial_gap + 1)) +
        min_trial_gap;

      // randomly select a stimulus item (without replacement to ensure no repeats) from the stimulus list
      var stimulus_item = jsPsych.randomization.sampleWithoutReplacement(
        stimulus_list,
        1,
      )[0];
      // create a mental rotation trial from the stimulus item
      var trial = {
        type: jsPsychImageKeyboardResponse,
        prompt:
          response_keys_assignment == RESPONSE_KEYS.DEFAULT
            ? default_prompt
            : reversed_prompt,
        choices: ["f", "j"],
        data: {
          correct_response: stimulus_item["correct_response"],
          correct_response_key: stimulus_item["correct_response_key"],
        },
        stimulus: stimulus_item["image_name"],
        on_finish: function (data) {
          // https://www.jspsych.org/v8/overview/progress-bar/
          // at the end of each trial, update the progress bar
          // increment number of completed trials by 1 and divide by total # of trials
          completed_trials++;
          jsPsych.progressBar.progress = completed_trials / total_trials;

          // check if response matches the trial's correct key
          data.correct = data.response === data.correct_key;
        },
        post_trial_gap: trial_gap,
      };
      timeline.push(trial);
    }

    /* Collect demographic information about participants */
    var demographic_info = {
      type: jsPsychSurveyMultiChoice,
      preamble:
        "<br><br><br><big><strong>Please answer the following demographic questions:</strong></big>", //in the experiment the preamble prompt is all the way at the top edge of the screen so I need to figure out how to style it to have some more padding around edge of the screen -aranza
      questions: [
        {
          prompt: "What is your age?",
          name: "Age",
          options: ["18-21", "22-25", "26-30", "31+"],
          required: true,
        },
        {
          prompt: "What year in college/university are you?",
          name: "Year",
          options: [
            "1st year",
            "2nd year",
            "3rd year",
            "4th year",
            "5th year+",
          ],
          required: true,
        },
        {
          prompt: "What is your specialization in Cognitive Science?", //this is assuming everyone in the class is a CogSci major, may change in the future? -aranza
          name: "Major",
          options: [
            "Neuroscience",
            "Clinical Aspects of Cognition",
            "Design & Interaction",
            "Machine Learning & Neural Computation",
            "Cognitive Behavioral Neuroscience",
            "Language & Culture",
            "None, B.S. in CogSci",
          ],
          required: true,
        },
        {
          prompt: "Do you have a minor?", //need to add text option for minor, but idk if i should do that in a separate function/ plugin...? -aranza
          name: "Minor",
          options: ["Yes", "No"],
          required: true,
        },
        {
          prompt: "Which gender do you most identify with?", //i can change the options or simply to sex for easier data analysis, i got this from SONA Systems example -aranza
          name: "Gender",
          options: [
            "Man",
            "Woman",
            "Non-binary/ Non-conforming",
            "Transgender",
            "Prefer not to say",
          ],
          required: true,
        },
      ],
    };
    timeline.push(demographic_info);

    /* DEBRIEF */
    // debrief participants -- just need to style it better for center - aranza
    var debrief = {
      type: jsPsychHtmlKeyboardResponse,
      stimulus:
        "<center>Thank you for participating in this study! We had you complete <i>all</i> those trials in order to investigate mental rotation abilities. With your help, we can better understand how people mentally rotate 3D objects in side-by-side comparisons. Press any key to complete the experiment.</center>",
    };
    // add the debrief trial to the timeline variable
    timeline.push(debrief);

    //PLEASE KEEP FOR ALL FUTURE ITERATIONS
    //this portion of the code ensures that the data gets sent to be stored on OSF
    const save_data = {
      type: jsPsychPipe,
      action: "save",
      experiment_id: "horOOckL0l3L",
      filename: filename,
      data_string: () => jsPsych.data.get().csv(),
    };
    timeline.push(save_data);
    //PLEASE KEEP FOR ALL FUTURE ITERATIONS

    /* thank you message */
    var thank_you = {
      type: jsPsychHtmlKeyboardResponse,
      stimulus:
        "Thank you for participating! Press any key to exit fullscreen.",
    };
    // add the thank you to the timeline variable
    timeline.push(thank_you);
    // exit fullscreen mode; code taken from: https://www.jspsych.org/v7/overview/fullscreen/
    timeline.push({
      type: jsPsychFullscreen,
      fullscreen_mode: false,
    });

    /* start the experiment */
    jsPsych.run(timeline);
  </script>
</html>
